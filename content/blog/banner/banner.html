<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Banner artikel AS-ADS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Poppins:wght@500;700;800&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1600px; height: 900px; overflow: hidden; }
  body { font-family: 'Poppins', sans-serif; }
  .card { position: relative; width: 1600px; height: 900px; overflow: hidden; background: var(--bg); color: #fff; }
  /* cahaya lembut di latar */
  .card::before { content: ""; position: absolute; inset: -20%; background:
      radial-gradient(40% 50% at 12% 30%, rgba(255,255,255,.35), transparent 70%),
      radial-gradient(35% 45% at 95% 15%, rgba(255,255,255,.25), transparent 70%); }
  /* bentuk aksen bergerigi seperti referensi */
  .spike { position: absolute; right: -40px; bottom: -40px; width: 900px; height: 560px; background: var(--accent);
    clip-path: polygon(0 100%, 6% 52%, 18% 70%, 30% 18%, 44% 58%, 58% 6%, 70% 46%, 84% 0, 100% 40%, 100% 100%); }
  .brand { position: absolute; top: 44px; left: 70px; display: flex; align-items: center; gap: 18px; z-index: 5; }
  .brand img { height: 64px; background: #fff; border-radius: 14px; padding: 6px 14px; }
  .brand span { font-weight: 700; font-size: 22px; letter-spacing: .02em; }
  .left { position: absolute; left: 66px; top: 135px; bottom: 90px; width: 760px; display: flex; flex-direction: column; justify-content: center; gap: 26px; z-index: 5; }
  .tagline { align-self: flex-start; font-weight: 500; font-size: 40px; line-height: 1.15; transform: rotate(-4deg); transform-origin: left; }
  .tagline mark { background: #111; color: #fff; padding: 0 12px; border: 2px dashed rgba(255,255,255,.7); }
  .title { font-family: 'DM Serif Display', serif; font-size: 124px; line-height: .9; letter-spacing: -0.035em; text-shadow: 0 6px 30px rgba(0,0,0,.18); }
  .title em { font-style: italic; color: var(--accent); }
  .oval { position: absolute; z-index: 6; padding: 16px 34px; border: 3px solid #fff; border-radius: 50%; font-weight: 700; font-size: 30px; line-height: 1.1; text-align: center; transform: rotate(-6deg); }
  .note { width: 470px; font-weight: 500; font-size: 24px; line-height: 1.3; }
  .note b { display: inline-block; margin-top: 10px; text-decoration: underline; text-underline-offset: 5px; }
  .foot { position: absolute; left: 70px; right: 70px; bottom: 34px; display: flex; justify-content: space-between; font-weight: 700; font-size: 22px; z-index: 6; }
  .foot .hash { font-style: italic; font-weight: 800; color: #111; background: #fff; padding: 2px 14px; border-radius: 8px; }
  .squiggle { position: absolute; z-index: 6; }
  .obj { position: absolute; z-index: 3; filter: drop-shadow(0 28px 40px rgba(0,0,0,.35)); }
  .sticker { position: absolute; z-index: 7; background: #fff; color: #111; font-weight: 800; padding: 10px 18px; border-radius: 12px; transform: rotate(5deg); font-size: 24px; box-shadow: 0 10px 25px rgba(0,0,0,.25); }
  .hand { font-family: 'Caveat', cursive; font-size: 40px; }
</style>
</head>
<body>
<div class="card" id="card"></div>

};

const key = new URLSearchParams(location.search).get('a') || 'banner';
const a = A[key];
const card = document.getElementById('card');
card.style.setProperty('--bg', a.bg); card.style.setProperty('--accent', a.accent);
card.innerHTML = `
  <div class="spike"></div>
  <div class="brand"><img src="${LOGO}" alt=""><span>Blog AS-ADS Cetak Desain</span></div>
  <div class="left"><div class="tagline">${a.tag}</div>
  <h1 class="title">${a.title}</h1>
  <p class="note">${a.note}</p></div>
  <div class="oval" style="${a.oval[2]}">${a.oval[0]}<br>${a.oval[1]}</div>
  ${a.obj}${a.extra}
  <div class="foot"><span>as-ads.cetakdesain.biz.id/blog</span><span class="hash"># KREATIF AJA</span></div>`;
</script>
</body>
</html>
